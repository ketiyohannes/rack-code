# Service accounts for the Rack daemon image.
#
# Two accounts rather than one, on purpose: the daemon executes agent-authored
# commands, so anything readable by the daemon's user must be assumed readable
# by an agent. The tailnet node key is not, which is why the sidecar runs as a
# separate user whose state directory the daemon cannot read.
#
# No account has a password; console login is disabled in the image.

#Type Name       ID  GECOS                      Home directory      Shell
u     rack       -   "Rack daemon"              /var/lib/rack       /bin/bash
u     rack-tsnet -   "Rack tailnet sidecar"     /var/lib/rack/tsnet /usr/sbin/nologin
